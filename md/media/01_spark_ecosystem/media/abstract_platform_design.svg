<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">数据价值链与平台需求（抽象图）</title>
  <desc id="desc">从数据产生与采集开始，经由收集存储、管理治理、处理分析，最终输出预测评估与决策价值；并强调可用性、可靠性、持久性与安全隐私等平台要求。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{fill:#475569;font-size:14px}
      .title{font-size:20px;font-weight:700}
      .box{fill:url(#card);stroke:#cbd5e1;stroke-width:1;rx:14;filter:url(#shadow)}
      .boxh{font-size:16px;font-weight:700}
      .pill{fill:#eef2ff;stroke:#c7d2fe;rx:16}
      .pill2{fill:#ecfeff;stroke:#a5f3fc;rx:16}
      .pill3{fill:#f0fdf4;stroke:#bbf7d0;rx:16}
      .pill4{fill:#fff7ed;stroke:#fed7aa;rx:16}
      .line{stroke:#64748b;stroke-width:2}
      .frame{fill:#ffffff;stroke:#e2e8f0;rx:18}
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="420" fill="url(#bg)"/>
  <rect x="26" y="22" width="908" height="376" class="frame" filter="url(#shadow)"/>

  <!-- header -->
  <text x="56" y="64" class="t title">从数据到价值：大数据平台抽象流程</text>
  <text x="56" y="88" class="t sub">数据不再只是“存起来”，更重要的是：可管理、可分析、可转化为决策与业务价值。</text>

  <!-- boxes -->
  <!-- geometry: width=150, height=78, y=128, x=45,225,405,585,765 -->
  <g class="t">
    <rect x="45" y="128" width="150" height="78" class="box"/>
    <text x="120" y="156" text-anchor="middle" class="boxh">数据产生/采集</text>
    <text x="120" y="178" text-anchor="middle" class="sub">业务系统・日志・设备</text>

    <rect x="225" y="128" width="150" height="78" class="box"/>
    <text x="300" y="156" text-anchor="middle" class="boxh">收集与存储</text>
    <text x="300" y="178" text-anchor="middle" class="sub">高效存储・存储模型</text>

    <rect x="405" y="128" width="150" height="78" class="box"/>
    <text x="480" y="156" text-anchor="middle" class="boxh">管理与治理</text>
    <text x="480" y="178" text-anchor="middle" class="sub">质量・元数据・权限</text>

    <rect x="585" y="128" width="150" height="78" class="box"/>
    <text x="660" y="156" text-anchor="middle" class="boxh">处理与分析</text>
    <text x="660" y="178" text-anchor="middle" class="sub">清洗・统计・挖掘・建模</text>

    <rect x="765" y="128" width="150" height="78" class="box"/>
    <text x="840" y="156" text-anchor="middle" class="boxh">价值输出</text>
    <text x="840" y="178" text-anchor="middle" class="sub">预测・评估・管理决策</text>
  </g>

  <!-- arrows -->
  <line x1="195" y1="167" x2="225" y2="167" class="line" marker-end="url(#arrow)"/>
  <line x1="375" y1="167" x2="405" y2="167" class="line" marker-end="url(#arrow)"/>
  <line x1="555" y1="167" x2="585" y2="167" class="line" marker-end="url(#arrow)"/>
  <line x1="735" y1="167" x2="765" y2="167" class="line" marker-end="url(#arrow)"/>

  <!-- platform requirements -->
  <text x="56" y="252" class="t boxh">平台关键要求</text>
  <text x="56" y="274" class="t sub">支撑“可持续用数据”的前提：稳定、可信、可控。</text>

  <g class="t" font-size="14" font-weight="700">
    <rect x="56" y="292" width="148" height="34" class="pill"/>
    <text x="130" y="315" text-anchor="middle">可用性</text>

    <rect x="216" y="292" width="148" height="34" class="pill2"/>
    <text x="290" y="315" text-anchor="middle">可靠性</text>

    <rect x="376" y="292" width="148" height="34" class="pill3"/>
    <text x="450" y="315" text-anchor="middle">持久性</text>

    <rect x="536" y="292" width="196" height="34" class="pill4"/>
    <text x="634" y="315" text-anchor="middle">安全/私密性</text>
  </g>

  <!-- scenarios -->
  <g class="t">
    <text x="56" y="360" class="boxh">典型应用场景</text>
    <text x="56" y="382" class="sub">医学大数据、自然语言处理、图像/语音识别、自动驾驶、风险预警等</text>
  </g>
</svg>
